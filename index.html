<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mon Budget</title>
  <meta name="description" content="Gestion de budget personnelle, hors ligne.">
  <meta name="theme-color" content="#f0e6d0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1a1208" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap">
  <link rel="stylesheet" href="styles.css?v=7">
</head>
<body>
  <div class="app">
    <nav class="tabbar" aria-label="Navigation principale">
      <div class="brand">
        <span class="emblem" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1" /><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4" /></svg></span>
        <span class="brand-txt"><strong>Mon Budget</strong><small>L'esprit tranquille</small></span>
      </div>
      <button data-view="home" class="tab">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8" /><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /></svg>
        <span>Accueil</span>
      </button>
      <button data-view="history" class="tab">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3 4 7l4 4" /><path d="M4 7h16" /><path d="m16 21 4-4-4-4" /><path d="M20 17H4" /></svg>
        <span>Opérations</span>
      </button>
      <button data-view="plan" class="tab">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1" /><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4" /></svg>
        <span>Budget</span>
      </button>
      <button data-view="stats" class="tab">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16v5" /><path d="M16 14v7" /><path d="M20 10v11" /><path d="m22 3-8.646 8.646a.5.5 0 0 1-.708 0L9.354 8.354a.5.5 0 0 0-.707 0L2 15" /><path d="M4 18v3" /><path d="M8 14v7" /></svg>
        <span>Stats</span>
      </button>
      <button data-view="accounts" class="tab">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 22h18" /><path d="M6 18v-7" /><path d="M10 18v-7" /><path d="M14 18v-7" /><path d="M18 18v-7" /><path d="M12 2 20 7H4z" /></svg>
        <span>Comptes</span>
      </button>
      <button data-view="settings" class="tab tab-settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" /><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1" /></svg>
        <span>Réglages</span>
      </button>

      <div class="side-foot">
        <figure class="sunset" aria-hidden="true">
          <svg viewBox="0 0 178 152">
            <defs><linearGradient id="sun-grad" x1="0" y1="4" x2="0" y2="84" gradientUnits="userSpaceOnUse"><stop offset="0" class="sun-a" /><stop offset="1" class="sun-b" /></linearGradient></defs>
            <path class="sun" d="M49 43.75C49 33.2 53.2 23.1 60.7 15.6 68.2 8.2 78.4 4 89 4s20.8 4.2 28.3 11.6c7.5 7.5 11.7 17.6 11.7 28.1H49ZM49.5 49.7h79l-1.3 6H50.8l-1.3-6Zm3 10.9h73l-3.1 6H55.6l-3.1-6Zm6.5 11h60l-7.2 5H66.2l-7.2-5Zm14 8.9h32c-10.7 4.6-21.3 4.6-32 0Z" />
            <path class="grid" d="M32 86H146M32 96H146M32 111H146M32 131H146M24 151H154M89 86 0 152M89 86 39 151M89 86 70.7 151M89 86 107.3 151M89 86 138.8 151M89 86 178 152" />
          </svg>
          <figcaption>Moins de flou. Plus de vous.</figcaption>
        </figure>
        <div class="local-box">
          <span class="local-state"><i></i>100 % hors ligne</span>
          <span class="local-note">Tes données restent dans ce navigateur.</span>
        </div>
        <button class="side-save" data-action="export">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3" /><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><path d="m7 10 5 5 5-5" /></svg>
          <span>Sauvegarder mes données</span>
        </button>
        <button class="theme-chip" data-action="theme-toggle" title="Changer de thème"><span class="theme-ico" aria-hidden="true"></span><span class="theme-label"></span></button>
      </div>
    </nav>

    <div class="main">
      <header class="topbar">
        <div class="top-text">
          <div class="crumb" aria-hidden="true">Mon espace / <span id="crumb">Accueil</span></div>
          <h1 id="title">Accueil</h1>
          <p id="subtitle" class="subtitle"></p>
        </div>
        <div class="top-tools">
          <div id="top-month"></div>
          <button class="top-add" data-action="open-add" title="Ajouter une opération (N)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
            <span>Ajouter une opération</span>
          </button>
        </div>
        <button class="icon-btn topbar-settings" data-action="goto" data-view="settings" aria-label="Réglages">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" /><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1" /></svg>
        </button>
      </header>
      <main id="view" class="view" tabindex="-1"></main>
      <footer class="page-foot">
        <span>Tes finances restent ici : données stockées uniquement dans ce navigateur.</span>
        <span class="mono">Ton budget, ton rythme. ✧</span>
      </footer>
    </div>

    <button id="fab" class="fab" aria-label="Ajouter une opération" title="Ajouter (N)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
    </button>
  </div>

  <div id="sheet-root" class="sheet-root" hidden>
    <div class="sheet-backdrop" data-close></div>
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="sheet-handle" aria-hidden="true"></div>
      <div id="sheet-body"></div>
    </section>
  </div>

  <div id="lock" class="lock" role="dialog" aria-modal="true" aria-label="Application verrouillée" hidden></div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <input id="import-file" type="file" accept="application/json,.json" hidden>
  <input id="csv-file" type="file" accept=".csv,text/csv,text/plain" hidden>

  <script src="plan.js?v=7"></script>
  <script src="stats.js?v=7"></script>
  <script src="csv.js?v=7"></script>
  <script src="lock.js?v=7"></script>
  <script src="app.js?v=7"></script>
</body>
</html>
