<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mon Budget</title>
  <meta name="description" content="Gestion de budget personnelle, hors ligne.">
  <meta name="theme-color" content="#0f766e">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="styles.css?v=4">
</head>
<body>
  <div class="app">
    <nav class="tabbar" aria-label="Navigation principale">
      <div class="brand"><img src="icons/icon.svg" alt="" width="32" height="32"><span>Mon Budget</span></div>
      <button class="side-add" data-action="open-add" title="Ajouter une opération (N)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
        <span>Ajouter</span>
      </button>
      <button data-view="home" class="tab">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" /></svg>
        <span>Accueil</span>
      </button>
      <button data-view="history" class="tab">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10" /></svg>
        <span>Opérations</span>
      </button>
      <button data-view="plan" class="tab">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" /><circle cx="12" cy="12" r="5" /><circle cx="12" cy="12" r="1" /></svg>
        <span>Budget</span>
      </button>
      <button data-view="stats" class="tab">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2" /></svg>
        <span>Stats</span>
      </button>
      <button data-view="accounts" class="tab">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2" /><path d="M3 10h18M7 15h4" /></svg>
        <span>Comptes</span>
      </button>
      <button data-view="settings" class="tab tab-settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" /><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1" /></svg>
        <span>Réglages</span>
      </button>
    </nav>

    <div class="main">
      <header class="topbar">
        <h1 id="title">Accueil</h1>
        <button class="icon-btn topbar-settings" data-action="goto" data-view="settings" aria-label="Réglages">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" /><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1" /></svg>
        </button>
      </header>
      <main id="view" class="view" tabindex="-1"></main>
    </div>

    <button id="fab" class="fab" aria-label="Ajouter une opération" title="Ajouter (N)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
    </button>
  </div>

  <div id="sheet-root" class="sheet-root" hidden>
    <div class="sheet-backdrop" data-close></div>
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="sheet-handle" aria-hidden="true"></div>
      <div id="sheet-body"></div>
    </section>
  </div>

  <div id="lock" class="lock" role="dialog" aria-modal="true" aria-label="Application verrouillée" hidden></div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <input id="import-file" type="file" accept="application/json,.json" hidden>
  <input id="csv-file" type="file" accept=".csv,text/csv,text/plain" hidden>

  <script src="plan.js?v=4"></script>
  <script src="stats.js?v=4"></script>
  <script src="csv.js?v=4"></script>
  <script src="lock.js?v=4"></script>
  <script src="app.js?v=4"></script>
</body>
</html>
